<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Redibis — Shared contract</title>
<style>
:root{--ink:#0f172a;--bg:#f8fafc;--surface:#fff;--border:#e2e8f0;--muted:#64748b;--accent:#2563eb;--green:#16a34a;--red:#e03131}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:15px;font-weight:800}.scope{background:#1e40af;color:#fff;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700}
.container{max-width:860px;margin:24px auto;padding:0 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px}
.col{border-bottom:1px solid var(--border);padding:12px 0}.col:last-child{border:0}
.col h4{font-family:ui-monospace,monospace;font-size:14px;margin-bottom:6px}
label{display:block;font-size:12px;color:var(--muted);margin:6px 0 3px}
input,textarea{font:inherit;border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:100%}
textarea{font-family:ui-monospace,monospace;font-size:12px;min-height:60px}
button{font:inherit;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;font-weight:700}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;transition:.3s}
.toast.show{opacity:1}.muted{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header><h1>REDIBIS · shared contract</h1><span class="scope" id="scope">…</span><span class="muted" id="tbl"></span></header>
<div class="container" id="container">Loading…</div>
<div class="toast" id="toast"></div>
<script src="/static/auth.js"></script>
<script>
const TOKEN = "{{ token }}";
const $ = (id)=>document.getElementById(id);
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m,ok=true){const t=$("toast");t.textContent=m;t.style.background=ok?"#0f172a":"#991b1b";t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
async function api(method,path,body){const o={method,headers:{}};if(body){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(body);}
  const r=await fetch(path,o);const d=await r.json();if(!r.ok)throw new Error(d.detail||r.statusText);return d;}
let SCOPE="all", CONTRACT=null;

async function load(){
  let data;
  try{ data = await api("GET","/api/share/"+TOKEN); }
  catch(e){ $("container").innerHTML = `<div class="card">This share link is invalid or expired.</div>`; return; }
  SCOPE = data.scope; CONTRACT = data.contract;
  $("scope").textContent = SCOPE; $("tbl").textContent = data.contract.table_name ? (data.contract.database_name+"."+data.contract.table_name) : "";
  const props = (CONTRACT.schema||[]).flatMap(s=>s.properties||[]);
  $("container").innerHTML = `<div class="card"><p class="muted">You may edit only <b>${esc(SCOPE)}</b> fields. Changes apply directly to the active contract and are audited.</p></div>
    <div class="card">${props.map(renderCol).join("")}</div>
    <button onclick="save()">Apply changes</button>`;
}
function renderCol(p){
  let fields="";
  if(SCOPE==="business"||SCOPE==="all"){
    const b=p.business||{};
    fields += `<label>Definition</label><textarea data-col="${esc(p.name)}" data-field="business.definition">${esc(b.definition||"")}</textarea>`;
  }
  if(SCOPE==="pii"||SCOPE==="all"){
    fields += `<label>Classification</label><input data-col="${esc(p.name)}" data-field="classification" value="${esc(p.classification||"")}"/>`;
    fields += `<label>PII entity type</label><input data-col="${esc(p.name)}" data-field="pii.entity_type" value="${esc((p.pii||{}).entity_type||"")}"/>`;
    const ce = (p.privacy||{}).classification_engine || p.pii || {};
    const isPii = !!ce.detected || !!p.maskingPolicy || !!((p.privacy||{}).masking_policy)
      || (p.tags||[]).some(t=>t==='pii'||t==='gdpr_personal_data')
      || (typeof p.classification==='string'&&p.classification.toLowerCase().startsWith('pii'));
    if(isPii){
      fields += `<label style="display:flex;align-items:center;gap:8px;color:var(--red);margin-top:8px">`
        + `<input type="checkbox" style="width:auto" data-col="${esc(p.name)}" data-field="remove_pii"/>`
        + ` Remove all PII — demote to a normal column</label>`;
    }
  }
  if(SCOPE==="quality"||SCOPE==="all"){
    fields += `<label>Quality rules (JSON)</label><textarea data-col="${esc(p.name)}" data-field="quality">${esc(JSON.stringify(p.quality||[]))}</textarea>`;
  }
  return `<div class="col"><h4>${esc(p.name)}</h4>${fields}</div>`;
}
async function save(){
  const columns={};
  // Columns flagged for PII removal — skip their other PII edits (the strip wins).
  const removeSet=new Set();
  document.querySelectorAll('[data-field="remove_pii"]').forEach(el=>{ if(el.checked) removeSet.add(el.dataset.col); });
  document.querySelectorAll("[data-col]").forEach(el=>{
    const col=el.dataset.col, field=el.dataset.field, val=el.value;
    columns[col]=columns[col]||{};
    if(field==="remove_pii"){ if(el.checked) columns[col].remove_pii=true; }
    else if(field==="business.definition"){ columns[col].business={...(columns[col].business||{}),definition:val}; }
    else if(field==="pii.entity_type"){ if(!removeSet.has(col)) columns[col].pii={...(columns[col].pii||{}),entity_type:val}; }
    else if(field==="classification"){ if(!removeSet.has(col)) columns[col].classification=val; }
    else if(field==="quality"){ try{ columns[col].quality=JSON.parse(val); }catch(e){} }
    else { columns[col][field]=val; }
  });
  try{ const r = await api("PATCH","/api/share/"+TOKEN,{edits:{columns}});
       toast(`Applied ${r.applied_fields.length} field(s) → v${r.version_after}`); load(); }
  catch(e){ toast(e.message,false); }
}
load();
</script>
</body>
</html>
