# Ground truth extracted from "Telecom Log PII Examples — Google Gemini" (21pp, 2026-09-12).
#
# GRADING NOTE — read before wiring into CI:
#   match: value      → graded on normalized value + entity_type only (no offsets).
#                       The source PDF right-truncates its code blocks, so exact raw
#                       transcripts (and therefore offsets) are NOT reproducible from it.
#                       Supply the raw text export to upgrade these to span-level grading.
#   grade: strict     → counts toward the CI gate.
#   grade: advisory   → tracked, never gates: the expected value is internally
#                       inconsistent (see `defect`) or depends on an unsettled policy.
#   canonical         → digit string the spoken form must assemble to.
#   negative: true    → must NOT be detected (or must be detected as `not_type`).
#
# Entity types use the repo's canonical vocabulary (redibis.models.canonical_entity).
# Types marked `proposed:` do not exist in the catalogue yet — see FREE_TEXT_PII_GROUND_TRUTH.md.

schema_version: 1
source: "Telecom Log PII Examples - Google Gemini.pdf"
extracted: 2026-09-12
default_match: value

suites:

