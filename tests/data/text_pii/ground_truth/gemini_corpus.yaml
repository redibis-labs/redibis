          - {value: "David Smith", type: PERSON}
          - {value: "+44 7911 123456", type: PHONE_NUMBER, region: GB}
          - {value: "david.smith123@example.com", type: EMAIL_ADDRESS}
      - id: EN2
        entities:
          - {value: "358190102938475", type: IMEI}
          - {value: "07700900112", type: PHONE_NUMBER, region: GB}
      - id: EN3
        entities:
          - {value: "42 Wallaby Way, Sydney, NSW 2000", type: LOCATION, note: "full composed address"}
          - {value: "00:1A:2B:3C:4D:5E", type: MAC_ADDRESS}
      - id: EN4
